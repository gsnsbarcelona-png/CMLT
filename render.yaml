services:
  - type: web
    name: tweet-automation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Las claves de X (X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET)
      # son opcionales: solo hacen falta para 'Publicar ahora'. Con 'Abrir en X' no.
      # Se pueden anadir luego en Render -> Environment.
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
